name: Secret scan

# Scans the lines added by a push or pull request for secrets (keys, tokens, passwords in URLs, ...) and warns about
# private data (private mail addresses, local user paths, private author addresses).  Uses only the Python standard
# library, see .github/scripts/scan-secrets.py.  Fails on secrets, only warns on private data.
# A line containing `secretscan:allow` is ignored by the scan.

on:
  push:
    branches:
      - 'main'
      - 'dotnet-update'
      - 'dev'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan added lines
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            python3 -I .github/scripts/scan-secrets.py --range "${BASE_SHA}..${HEAD_SHA}"
          elif [ "$EVENT" = "push" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            python3 -I .github/scripts/scan-secrets.py --range "${BEFORE_SHA}..${HEAD_SHA}"
          else
            # new branch, force push or manual run: scan the whole history
            python3 -I .github/scripts/scan-secrets.py --all
          fi
